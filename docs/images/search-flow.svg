<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="How one search is answered" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How one search is answered</title><defs><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d73948"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="1120" height="700" rx="16" fill="#f1f5f9"/><text x="28" y="40" text-anchor="start" font-size="20" font-weight="700" fill="#1e293b">How a search is answered</text><text x="28" y="62" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Each seller is handled in parallel and results stream to the page as each one answers, so a slow seller never blocks the rest.</text><rect x="420" y="86" width="280" height="50" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">GET /api/search/stream?…</text><rect x="420" y="160" width="280" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="560.0" y="190.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Pick the sellers for this mode</text><path d="M560,136 L560,158" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><rect x="40" y="236" width="1040" height="300" rx="14" fill="#eef2f7" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="54" y="256" font-size="12" font-weight="700" fill="#64748b">For every seller, in parallel</text><rect x="60" y="270" width="170" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">In shared cache?</text><text x="145.0" y="313" text-anchor="middle" font-size="12" fill="#64748b">fresh, or refresh in bg</text><rect x="270" y="270" width="170" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="355.0" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Same search running?</text><text x="355.0" y="313" text-anchor="middle" font-size="12" fill="#64748b">share it (any process)</text><rect x="480" y="270" width="170" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="565.0" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Seller paused?</text><text x="565.0" y="313" text-anchor="middle" font-size="12" fill="#64748b">circuit open or 429</text><rect x="690" y="270" width="170" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="775.0" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Wait for pace slot</text><text x="775.0" y="313" text-anchor="middle" font-size="12" fill="#64748b">min gap per seller</text><rect x="900" y="270" width="170" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="985.0" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Call the seller</text><text x="985.0" y="313" text-anchor="middle" font-size="12" fill="#64748b">timeout 15 s</text><path d="M230,302 L268,302" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><rect x="238.0" y="278" width="24" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="250" y="291" text-anchor="middle" font-size="11.5" fill="#64748b">no</text><path d="M440,302 L478,302" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><rect x="448.0" y="278" width="24" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="460" y="291" text-anchor="middle" font-size="11.5" fill="#64748b">no</text><path d="M650,302 L688,302" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><rect x="658.0" y="278" width="24" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="670" y="291" text-anchor="middle" font-size="11.5" fill="#64748b">no</text><path d="M860,302 L898,302" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M560,210 L560,236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><rect x="60" y="380" width="170" height="56" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="145.0" y="413.0" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Use cached answer</text><path d="M145,334 L145,378" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/><rect x="165" y="348" width="31" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="165" y="361" text-anchor="start" font-size="11.5" fill="#15803d">yes</text><rect x="270" y="380" width="170" height="56" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="355.0" y="413.0" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Await shared call</text><path d="M355,334 L355,378" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/><rect x="375" y="348" width="31" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="375" y="361" text-anchor="start" font-size="11.5" fill="#15803d">yes</text><rect x="480" y="380" width="170" height="72" rx="10" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/><text x="565.0" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Last good answer</text><text x="565.0" y="423" text-anchor="middle" font-size="12" fill="#64748b">≤ 15 min, marked stale</text><text x="565.0" y="440" text-anchor="middle" font-size="12" fill="#64748b">else: unavailable</text><path d="M565,334 L565,378" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah-a)"/><rect x="585" y="348" width="31" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="585" y="361" text-anchor="start" font-size="11.5" fill="#b45309">yes</text><rect x="830" y="380" width="230" height="46" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="945.0" y="408.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">OK → cache + record price</text><rect x="830" y="432" width="230" height="46" rx="10" fill="#fdecee" stroke="#d73948" stroke-width="1.5"/><text x="945.0" y="460.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d73948">429 → pause for Retry-After</text><rect x="830" y="484" width="230" height="46" rx="10" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/><text x="945.0" y="512.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Error → retry once, then breaker</text><path d="M985,334 L985,378" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/><path d="M828,455 L740,455 L740,428 L652,428" fill="none" stroke="#d73948" stroke-width="1.6" marker-end="url(#ah-r)"/><rect x="752.0" y="464" width="66" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="785" y="477" text-anchor="middle" font-size="11.5" fill="#d73948">no retry</text><rect x="300" y="566" width="520" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="560.0" y="596.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Merge: one row per physical trip (route + number + departure)</text><rect x="300" y="630" width="520" height="50" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="660.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">One offer per seller, cheapest buyable first; sold-out last</text><path d="M560,536 L560,564" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M560,616 L560,628" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/></svg>