<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Round-trip flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Round-trip flow</title><defs><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d73948"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="1120" height="330" rx="16" fill="#f1f5f9"/><text x="28" y="40" text-anchor="start" font-size="20" font-weight="700" fill="#1e293b">Round trip (رفت و برگشت)</text><text x="28" y="62" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">A round trip is two one-way searches, so it works the same for flights, trains and buses and for every seller.</text><rect x="28" y="120" width="200" height="120" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="128.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">/search?…&amp;return=</text><text x="128.0" y="163" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THR → MHD</text><text x="128.0" y="180" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">date=2026-10-20</text><text x="128.0" y="197" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">return=2026-10-25</text><rect x="276" y="92" width="220" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="386.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Outbound leg</text><text x="386.0" y="135" text-anchor="middle" font-size="12" fill="#64748b">THR → MHD, 20 Oct</text><rect x="276" y="196" width="220" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="386.0" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Return leg</text><text x="386.0" y="239" text-anchor="middle" font-size="12" fill="#64748b">MHD → THR, 25 Oct</text><path d="M228,165 L274,130" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah-b)"/><path d="M228,195 L274,232" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah-b)"/><text x="386" y="186" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">searched in parallel</text><rect x="544" y="92" width="210" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="649.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Pick outbound</text><text x="649.0" y="135" text-anchor="middle" font-size="12" fill="#64748b">tab switches to return</text><rect x="544" y="196" width="210" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="649.0" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Pick return</text><text x="649.0" y="239" text-anchor="middle" font-size="12" fill="#64748b">own filters &amp; date strip</text><path d="M496,129 L542,129" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M496,233 L542,233" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M649,166 L649,194" fill="none" stroke="#d73948" stroke-width="1.6" marker-end="url(#ah-r)"/><rect x="802" y="120" width="290" height="120" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="947.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Total bar</text><text x="947.0" y="163" text-anchor="middle" font-size="12" fill="#64748b">(outbound + return) × passengers</text><text x="947.0" y="180" text-anchor="middle" font-size="12" fill="#64748b">each pick links to its trip page</text><text x="947.0" y="197" text-anchor="middle" font-size="12" fill="#64748b">buy each leg on the seller&#x27;s site</text><path d="M754,233 L800,200" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/><path d="M754,129 L800,160" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="28" y="300" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">Changing the outbound date past the return pushes the return forward; the return can never be before the outbound.</text></svg>