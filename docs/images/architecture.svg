<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Torob Ticket architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Torob Ticket architecture</title><defs><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d73948"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="1120" height="640" rx="16" fill="#f1f5f9"/><text x="28" y="40" text-anchor="start" font-size="20" font-weight="700" fill="#1e293b">Architecture</text><text x="28" y="62" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Several FastAPI processes share Postgres and Redis and serve the React app; every seller is an adapter behind one interface.</text><rect x="28" y="160" width="180" height="220" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.5"/><text x="118.0" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Browser</text><text x="118.0" y="203" text-anchor="middle" font-size="12" fill="#64748b">React + Vite SPA</text><text x="118.0" y="220" text-anchor="middle" font-size="12" fill="#64748b">Persian, RTL, Jalali</text><text x="118.0" y="237" text-anchor="middle" font-size="12" fill="#64748b">flight / train / bus</text><text x="118.0" y="254" text-anchor="middle" font-size="12" fill="#64748b">favourites &amp; recent</text><text x="118.0" y="271" text-anchor="middle" font-size="12" fill="#64748b">searches (localStorage)</text><rect x="250" y="110" width="200" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="264" y="134" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b">FastAPI × N processes</text><text x="264" y="153" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /api/search[/stream]</text><text x="264" y="170" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /api/calendar</text><text x="264" y="187" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /api/trips/{id}</text><text x="264" y="204" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /api/cities</text><text x="264" y="221" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /api/popular</text><text x="264" y="238" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">POST /api/alerts</text><text x="264" y="255" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /api/providers/status</text><text x="264" y="272" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET  /*  → SPA (index.html)</text><rect x="490" y="90" width="270" height="360" rx="14" fill="#eef2f7" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="504" y="110" font-size="12" font-weight="700" fill="#64748b">SearchService</text><rect x="506" y="118" width="238" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Shared cache (Redis)</text><text x="625.0" y="161" text-anchor="middle" font-size="12" fill="#64748b">fresh 60 s, refreshed in bg ≤ 5 min</text><rect x="506" y="182" width="238" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Shared in-flight calls</text><text x="625.0" y="225" text-anchor="middle" font-size="12" fill="#64748b">one request across all processes</text><rect x="506" y="246" width="238" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Pacing + 429 pause</text><text x="625.0" y="289" text-anchor="middle" font-size="12" fill="#64748b">shared; honours Retry-After</text><rect x="506" y="310" width="238" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Retry + circuit breaker</text><text x="625.0" y="353" text-anchor="middle" font-size="12" fill="#64748b">1 retry, skip after 3 fails</text><rect x="506" y="374" width="238" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Merge &amp; rank</text><text x="625.0" y="417" text-anchor="middle" font-size="12" fill="#64748b">streamed as each seller answers</text><rect x="800" y="90" width="292" height="360" rx="14" fill="#eef2f7" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="814" y="110" font-size="12" font-weight="700" fill="#64748b">Sellers (adapters)</text><rect x="816" y="118" width="260" height="54" rx="10" fill="#fdecee" stroke="#d73948" stroke-width="1.5"/><text x="946.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#d73948">Alibaba · flights</text><text x="946.0" y="161" text-anchor="middle" font-size="12" fill="#64748b">ws.alibaba.ir  start → poll</text><rect x="816" y="182" width="260" height="54" rx="10" fill="#fdecee" stroke="#d73948" stroke-width="1.5"/><text x="946.0" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#d73948">Alibaba · trains</text><text x="946.0" y="225" text-anchor="middle" font-size="12" fill="#64748b">start → poll, per wagon class</text><rect x="816" y="246" width="260" height="54" rx="10" fill="#fdecee" stroke="#d73948" stroke-width="1.5"/><text x="946.0" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#d73948">Alibaba · buses</text><text x="946.0" y="289" text-anchor="middle" font-size="12" fill="#64748b">one GET, numeric city codes</text><rect x="816" y="310" width="260" height="54" rx="10" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/><text x="946.0" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Safarmarket · flights</text><text x="946.0" y="353" text-anchor="middle" font-size="12" fill="#64748b">metasearch: many agencies</text><rect x="816" y="374" width="260" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="946.0" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Demo sellers</text><text x="946.0" y="417" text-anchor="middle" font-size="12" fill="#64748b">deterministic, no network</text><rect x="250" y="480" width="200" height="120" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="350.0" y="504" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">PostgreSQL</text><text x="350.0" y="523" text-anchor="middle" font-size="12" fill="#64748b">price history per trip</text><text x="350.0" y="540" text-anchor="middle" font-size="12" fill="#64748b">price alerts</text><text x="350.0" y="557" text-anchor="middle" font-size="12" fill="#64748b">schema created on start</text><rect x="490" y="480" width="270" height="120" rx="10" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="504" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Background jobs</text><text x="625.0" y="523" text-anchor="middle" font-size="12" fill="#64748b">hourly watchlist sampling</text><text x="625.0" y="540" text-anchor="middle" font-size="12" fill="#64748b">one process per run (Redis lease)</text><text x="625.0" y="557" text-anchor="middle" font-size="12" fill="#64748b">alert checker → notifiers</text><rect x="800" y="480" width="292" height="120" rx="10" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="946.0" y="504" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Notifiers</text><text x="946.0" y="523" text-anchor="middle" font-size="12" fill="#64748b">console log</text><text x="946.0" y="540" text-anchor="middle" font-size="12" fill="#64748b">webhook (SMS gateway, Telegram…)</text><text x="946.0" y="557" text-anchor="middle" font-size="12" fill="#64748b">SMTP e-mail</text><path d="M208,270 L248,270" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah-b)"/><path d="M450,270 L488,270" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M760,270 L798,270" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M350,430 L350,478" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/><rect x="344.0" y="446" width="122" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="405" y="459" text-anchor="middle" font-size="11.5" fill="#15803d">history / alerts</text><path d="M625,480 L625,452" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><rect x="639.0" y="458" width="66" height="17" rx="4" fill="#ffffff" opacity=".92"/><text x="672" y="471" text-anchor="middle" font-size="11.5" fill="#64748b">searches</text><path d="M760,540 L798,540" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah-m)"/><path d="M490,540 L452,540" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah-g)"/></svg>