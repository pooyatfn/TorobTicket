name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    # Real Postgres and Redis, so the multi-process tests (shared cache, breaker, pacing) run too.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: torob, POSTGRES_PASSWORD: torob, POSTGRES_DB: torob_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U torob" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TORUB_TEST_DATABASE_URL: postgresql://torob:torob@localhost:5432/torob_test
      TORUB_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t torobticket:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name t -p 8000:8000 -e TORUB_PROVIDERS=demo torobticket:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break || sleep 1; done
          curl -fs localhost:8000/ | grep -q "ترب تیکت"
          curl -fs "localhost:8000/api/airports?q=mashhad" | grep -q MHD
